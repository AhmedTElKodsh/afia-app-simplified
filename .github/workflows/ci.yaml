# CI/CD Pipeline — Phase 1 (D-01: single workflow, staged jobs)
#
# Trigger matrix per D-02:
#   Push/PR         → lint + vitest + tsc build + path-filtered quick eval
#   Merge to main   → full eval:dev + eval:holdout + edge-eval + deploy staging
#   Nightly cron    → full eval:dev + eval:holdout + edge-eval (drift detection)
#   Manual dispatch → signoff gate (human review)
#
# Rollback procedure (manual):
#   1. git revert HEAD --no-edit && git push
#   2. Verify staging at https://afia-stage1.workers.dev
#   3. If rollback is urgent: git revert with GIT_SEQUENCE_EDITOR

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC drift detection (D-02 nightly)
  workflow_dispatch:
    inputs:
      run_signoff:
        description: "Run signoff gate (manual human review)"
        type: boolean
        default: false
      run_nightly:
        description: "Run full nightly eval (drift detection)"
        type: boolean
        default: false

# Secrets are scoped per job below — no workflow-level env block.
# Fork PRs (lint-test-build only) must NOT have access to secrets.

# Per Murat: eval concurrency group prevents overlapping eval runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════
  # JOB: lint-test-build (runs on push/PR)
  # ═══════════════════════════════════════════════════
  lint-test-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (tsc type-check)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

      # Path filtering per D-03: quick eval only on worker/src/ or evals/ changes
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src_or_eval:
              - 'worker/src/**'
              - 'evals/**'
              - 'worker/test/fixtures/**'

      - name: Quick eval (10-fixture probe, per D-04)
        if: steps.filter.outputs.src_or_eval == 'true'
        run: pnpm eval:dev-quick --min-exact=50
        # --min-exact=50: fails build if exact accuracy drops below 50%
        # Catches catastrophic regressions (model collapse, API failure)

      - name: Edge-case CV eval (20 images)
        if: steps.filter.outputs.src_or_eval == 'true'
        run: pnpm eval:edge --min-exact=30
        # --min-exact=30: edge cases are harder; fails only on catastrophic regressions

  # ═══════════════════════════════════════════════════
  # JOB: full-eval (runs on merge to main)
  # ═══════════════════════════════════════════════════
  full-eval:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test-build
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      MODEL_ID: ${{ secrets.MODEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Full dev eval (60 fixtures)
        run: pnpm eval:dev

      - name: Full holdout eval (40 fixtures)
        run: pnpm eval:holdout

      - name: Upload eval JSONL results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: runs/

  # ═══════════════════════════════════════════════════
  # JOB: edge-eval (CV pipeline on edge-case corpus)
  # ═══════════════════════════════════════════════════
  edge-eval:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Edge-case CV eval
        run: pnpm eval:edge

      - name: Upload edge-eval results
        uses: actions/upload-artifact@v4
        with:
          name: edge-eval-${{ github.run_id }}
          path: runs/

  # ═══════════════════════════════════════════════════
  # JOB: deploy-staging (Winston: predeploy validation + env isolation)
  # ═══════════════════════════════════════════════════
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: full-eval
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Predeploy validation step (Winston: staging env isolation)
      - name: Predeploy — verify env config
        run: |
          echo "::notice::Deploying to staging (afia-stage1)"
          echo "Target: afia-stage1.workers.dev"
          echo "Branch: ${{ github.ref }}"

      - name: Deploy staging Worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ═══════════════════════════════════════════════════
  # JOB: nightly-eval (drift detection via cron)
  # ═══════════════════════════════════════════════════
  nightly-eval:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)
    runs-on: ubuntu-latest
    env:
      # Drift detection eval needs LLM API keys + Supabase DB access
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      MODEL_ID: ${{ secrets.MODEL_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Full dev eval
        run: pnpm eval:dev

      - name: Full holdout eval
        run: pnpm eval:holdout

      - name: Edge-case CV eval
        run: pnpm eval:edge

      - name: Upload nightly eval results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: runs/

  # ═══════════════════════════════════════════════════
  # JOB: signoff (manual trigger, human review per D-05)
  # ═══════════════════════════════════════════════════
  signoff:
    if: github.event_name == 'workflow_dispatch' && inputs.run_signoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run signoff gate (requires 3 prior holdout runs)
        run: pnpm signoff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
