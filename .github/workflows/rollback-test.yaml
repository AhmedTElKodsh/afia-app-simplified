name: Rollback Test
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: "Dry run (list only, no rollback)"
        type: boolean
        default: true

jobs:
  rollback-test:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List recent deployments
        run: npx wrangler deployments list --name "${{ github.event.inputs.environment == 'production' && 'afia' || 'afia-stage1' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Validate rollback script syntax
        run: bash -n scripts/rollback-test.sh
